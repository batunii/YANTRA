name: APK

on:
  push:
    # Every branch the work actually happens on. It was main and one long-lived branch, which meant
    # the build ran for two of the seven branches this repo has had and silently for none of the
    # rest — a build server that does not run is indistinguishable from a build that passes.
    branches: [main, UI_Changes, 'feature/**', 'fix/**', 'release/**']
    # Tagging is how you ask for a build you can keep: a tag run also publishes a
    # Release with the APK attached, because run artifacts expire and are only
    # reachable by people who can see the Actions tab.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# One build per branch; pushing again cancels the run that is now out of date.
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Only so a tag build can create its Release; nothing else here writes.
      contents: write

    # Lifted to the job because a step's own `env:` is not in scope for that step's `if:`, and this
    # is read by one. It is empty for a run that is not entitled to secrets — a fork's pull
    # request — which is exactly the condition being tested.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v4

      # JDK 21, which is what this project is actually built on. Not 17: the module's
      # sourceCompatibility and jvmTarget of 17 say which bytecode to EMIT, which is a separate
      # question from which JDK runs Gradle and AGP 9.2.1. Pinning CI to 17 on the strength of that
      # number would have been a guess — this is the one configuration the build is known to work
      # under.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Handles the Gradle distribution named in gradle-wrapper.properties (9.4.1) and caches
      # ~/.gradle between runs.
      - uses: gradle/actions/setup-gradle@v4

      # app/build/ is checked into this repository (1451 files — .gitignore only excludes /build,
      # not app/build), so a fresh checkout arrives with another machine's intermediates already in
      # place. Gradle would mostly cope, but "mostly" is not what a build server is for: deleting
      # them means every run starts from source and a green build actually means the source
      # compiles.
      # app/build/ used to be checked into this repository, so a fresh checkout arrived with
      # another machine's intermediates already in place. .gitignore covers it now and nothing is
      # tracked under it, but a stale working copy on a self-hosted runner would still poison a
      # build, and starting from source is what makes a green run mean the source compiles.
      - name: Discard any build outputs
        run: rm -rf app/build

      # The unit suite, before anything is packaged. A build server that produces an installable
      # APK from code whose tests fail is telling you the wrong thing twice.
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      # The signing key, when this run is entitled to it. Forks and pull requests get no secrets,
      # so those runs build the debug variant instead of failing at the signing step — a
      # contributor's PR should still tell them whether their change compiles and runs.
      - name: Unpack the signing key
        id: key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/yantra-release.jks
          cat > keystore.properties <<EOF
          storeFile=yantra-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
          echo "signed=true" >> "$GITHUB_OUTPUT"

      # Release when it can be signed, debug otherwise. The release variant is the one worth
      # shipping and worth testing: R8 and resource shrinking take the APK from 38 MB to under 9,
      # and they are also the only part of the build that can break code that works unminified.
      # A debug artifact was standing in for it, which meant the shipped APK was the one
      # configuration nobody had ever run.
      - name: Assemble
        id: apk
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            ./gradlew :app:assembleRelease --no-daemon --stacktrace
            # The release variant is split per architecture, so there is no single
            # `app-release.apk` any more. arm64 is the one to publish: every Android phone sold for
            # years is arm64, and the other two exist for 32-bit hardware and for emulators.
            echo "path=app/build/outputs/apk/release/app-arm64-v8a-release.apk" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
            echo "path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      # A tag build has one job: produce the thing people install. Falling back to an unsigned,
      # unminified debug APK is right for a fork's pull request and wrong here — it published an
      # 80 MB debug build as v0.4.0, which is nine times the size of the real one and the one
      # configuration nobody had run. A missing key on a tag is a misconfigured repository, and the
      # build should say so rather than quietly ship the wrong artifact.
      - name: A tag must produce a signed release build
        if: github.ref_type == 'tag' && steps.apk.outputs.kind != 'release'
        run: |
          echo "::error::Tag ${GITHUB_REF_NAME} built the debug variant: the signing secrets are" \
               "not set on this repository. Set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and" \
               "KEY_PASSWORD, then re-push the tag."
          exit 1

      # The key does not outlive the job that needed it. The runner is ephemeral, but a workspace
      # that still holds a signing key while later steps run arbitrary Gradle plugins is a wider
      # window than this needs.
      - name: Shred the signing key
        if: always()
        run: rm -f app/yantra-release.jks keystore.properties

      # A tag names itself; anything else is identified by the commit it came from.
      - name: Work out what to call this build
        id: name
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "label=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "label=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: yantra-${{ steps.apk.outputs.kind }}-${{ steps.name.outputs.label }}
          path: ${{ steps.apk.outputs.path }}
          # A silently empty artifact is worse than a failed job: it looks like a build you can
          # install.
          if-no-files-found: error
          retention-days: 14

      # gh is preinstalled on GitHub runners, so this needs no third-party action in the release
      # path. The variant stays in the filename: a debug-signed APK installs and runs but is not a
      # build for distribution, and whoever finds the file later should be able to tell which one
      # they have without unzipping it.
      - name: Publish the tagged APK as a Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "${{ steps.apk.outputs.path }}" \
             "yantra-$GITHUB_REF_NAME-arm64.apk"
          # The 32-bit build too, for anything old enough to need it. Named by architecture rather
          # than left as `app-armeabi-v7a-release.apk`, so whoever finds the file later can tell
          # which one they have without unzipping it.
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk \
             "yantra-$GITHUB_REF_NAME-armeabi-v7a.apk" || true
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "yantra-$GITHUB_REF_NAME-arm64.apk" \
            "yantra-$GITHUB_REF_NAME-armeabi-v7a.apk"
