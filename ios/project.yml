# xcodegen spec — `xcodegen generate` in this directory produces Yantra.xcodeproj.
# The project file is generated, not committed: this spec is the truth, the way the
# Android build files are for app/.
name: Yantra
options:
  bundleIdPrefix: ie.shoonya
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
packages:
  YantraCore:
    path: YantraCore
settings:
  base:
    SWIFT_VERSION: "5.10"
    # Manual, ad-hoc: on the simulator this passes the entitlements file through untouched. Automatic
    # signing filters entitlements against the team's capabilities and a free team has no App Groups,
    # which silently emptied the .xcent and left the widgets unable to see the workspace.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Yantra:
    type: application
    platform: iOS
    sources:
      - path: Yantra/Sources
      - path: Shared
      - path: Yantra/Assets.xcassets
      - path: Yantra/Fonts
        buildPhase: resources
      - path: ../conformance
        type: folder
        buildPhase: resources
    dependencies:
      - package: YantraCore
      - target: YantraWidgets
        embed: true
      - target: YantraShare
        embed: true
    entitlements:
      path: Yantra/Yantra.entitlements
      properties:
        com.apple.security.application-groups: [group.ie.shoonya.yantra]
    info:
      path: Yantra/Info.plist
      properties:
        CFBundleDisplayName: Yantra
        UIAppFonts: [bricolage_grotesque.ttf, space_grotesk.ttf, space_mono_regular.ttf, space_mono_bold.ttf]
        UIUserInterfaceStyle: Dark
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [ie.shoonya.yantra.sync]
        NSCalendarsUsageDescription: Yantra draws your meetings beside your tasks. It only ever reads them — nothing is added to or changed in your calendars.
        NSCalendarsFullAccessUsageDescription: Yantra draws your meetings beside your tasks. It only ever reads them — nothing is added to or changed in your calendars.
        CFBundleURLTypes:
          - CFBundleURLName: ie.shoonya.yantra
            CFBundleURLSchemes: [yantra]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.shoonya.yantra
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Jade AppIcon-Azure AppIcon-Indigo AppIcon-Orchid
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

  YantraWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
      - path: Yantra/Fonts
        buildPhase: resources
    dependencies:
      - package: YantraCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/Widgets.entitlements
      properties:
        com.apple.security.application-groups: [group.ie.shoonya.yantra]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Yantra
        UIAppFonts: [bricolage_grotesque.ttf, space_grotesk.ttf, space_mono_regular.ttf, space_mono_bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.shoonya.yantra.widgets
        SKIP_INSTALL: YES

  YantraShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Share
      - path: Shared
      - path: Yantra/Fonts
        buildPhase: resources
    dependencies:
      - package: YantraCore
    entitlements:
      path: Share/Share.entitlements
      properties:
        com.apple.security.application-groups: [group.ie.shoonya.yantra]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Add to Yantra
        UIAppFonts: [bricolage_grotesque.ttf, space_grotesk.ttf, space_mono_regular.ttf, space_mono_bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ie.shoonya.yantra.share
        SKIP_INSTALL: YES
